name: Deploy Notification

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send Discord notification
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}
          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK_URL" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          if [ -n "$COMMITS_JSON" ] && [ "$COMMITS_JSON" != "null" ] && [ "$COMMITS_JSON" != "[]" ]; then
            WHATS_NEW=$(echo "$COMMITS_JSON" | jq -r '[.[] | "• " + (.message | split("\n")[0])] | join("\n")')
          else
            WHATS_NEW="• Ручной запуск"
          fi

          STATS=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            COMPARE=$(gh api "repos/$REPO/compare/$BEFORE_SHA...$COMMIT_SHA" 2>/dev/null || echo '{}')
            FILES=$(echo "$COMPARE" | jq '(.files // []) | length')
            ADD=$(echo "$COMPARE" | jq '[(.files // [])[].additions] | add // 0')
            DEL=$(echo "$COMPARE" | jq '[(.files // [])[].deletions] | add // 0')
            if [ "$FILES" != "0" ]; then
              STATS="${FILES} файлов · +${ADD} −${DEL}"
            fi
          fi

          PAYLOAD=$(jq -n \
            --arg title "🚀 Сайт обновлён" \
            --arg whatsnew "$WHATS_NEW" \
            --arg author "$COMMIT_AUTHOR" \
            --arg sha "$SHORT_SHA" \
            --arg stats "$STATS" \
            --arg commitUrl "$COMMIT_URL" \
            --arg site "https://ketchupandmayo.vercel.app" \
            --arg thumb "https://ketchupandmayo.vercel.app/og-image.png" \
            '{
              embeds: [{
                title: $title,
                url: $commitUrl,
                color: 14221118,
                fields: ([
                  { name: "Что нового", value: $whatsnew, inline: false },
                  { name: "Автор", value: $author, inline: true },
                  { name: "Коммит", value: $sha, inline: true }
                ] + (if $stats != "" then [{ name: "Изменения", value: $stats, inline: true }] else [] end) + [
                  { name: "Сайт", value: $site, inline: false }
                ]),
                thumbnail: { url: $thumb },
                footer: { text: "ketchupandmayo/ketchupandmayo" },
                timestamp: (now | todate)
              }]
            }')

          curl -s -X POST "$DISCORD_DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD"
